<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesticide Shop Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div>
        <h1>🌱 Shop Manager</h1>
        <p>Pesticide Sales & Credit Management</p>
    </div>
</header>

<main>

    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="card">
            <span>Total Sales</span>
            <strong id="totalSales">₹0</strong>
        </div>

        <div class="card">
            <span>Cash Sales</span>
            <strong id="cashSales">₹0</strong>
        </div>

        <div class="card">
            <span>Credit Given</span>
            <strong id="creditSales">₹0</strong>
        </div>

        <div class="card">
            <span>Outstanding Credit</span>
            <strong id="outstandingCredit">₹0</strong>
        </div>

    </section>


    <!-- ADD SALE -->

    <section class="panel">

        <h2>Add New Sale</h2>

        <form id="saleForm">

            <div class="form-grid">

                <div>
                    <label>Customer Name</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="e.g. Ramesh Kumar"
                        required
                    >
                </div>

                <div>
                    <label>Product</label>
                    <input
                        type="text"
                        id="product"
                        placeholder="e.g. Glyphosate"
                        required
                    >
                </div>

                <div>
                    <label>Quantity</label>
                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        placeholder="1"
                        required
                    >
                </div>

                <div>
                    <label>Total Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        min="0"
                        placeholder="500"
                        required
                    >
                </div>

                <div>
                    <label>Payment</label>

                    <select id="payment">
                        <option value="cash">Cash</option>
                        <option value="credit">Credit</option>
                    </select>

                </div>

                <div>
                    <label>Date</label>

                    <input
                        type="date"
                        id="saleDate"
                        required
                    >

                </div>

            </div>

            <button type="submit" class="primary-btn">
                + Add Sale
            </button>

        </form>

    </section>


    <!-- CREDIT CUSTOMERS -->

    <section class="panel">

        <div class="section-header">

            <div>
                <h2>Credit Customers</h2>
                <p>Customers who currently owe money</p>
            </div>

            <input
                type="text"
                id="searchCustomer"
                placeholder="Search customer..."
            >

        </div>

        <div id="creditCustomers"></div>

    </section>


    <!-- SALES HISTORY -->

    <section class="panel">

        <div class="section-header">

            <div>
                <h2>Sales History</h2>
                <p>All transactions</p>
            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Amount</th>
                        <th>Payment</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="salesTable"></tbody>

            </table>

        </div>

    </section>

</main>


<!-- CUSTOMER DETAILS MODAL -->

<div id="customerModal" class="modal">

    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h2 id="modalCustomerName"></h2>

        <div id="customerDetails"></div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
